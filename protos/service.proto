// Protocol Buffer definitions for common service message types.
//
// This file contains shared message types and enums used across
// the UDM (Universal Drink Machine) service, including request/response
// messages for managing fluid regulators, recipes, instructions, 
// and ingredients.

syntax = "proto3";
package service_types;

import "fhs.proto";
import "recipe.proto";

// GenericEmpty is an empty message type used for responses
// that don't need to return data.
message GenericEmpty {

}

// EntityType defines the different types of entities managed
// by the service.
enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_RECIPE = 1;
  ENTITY_TYPE_FLUID = 2;
  ENTITY_TYPE_INSTRUCTION = 3;
  ENTITY_TYPE_INGREDIENT = 4;
}

// Config holds server configuration settings.
message Config {
  int32 port = 1;
}

// GenericRemovalResponse is returned when an entity is successfully removed.
message GenericRemovalResponse {

}

// ModifyFluidRegulatorRequest requests modification 
// of an existing fluid regulator.
message ModifyFluidRegulatorRequest {
  fhs_types.FluidRegulator fluid = 1;
}

// ModifyFluidRegulatorResponse returns the ID of the modified fluid regulator.
message ModifyFluidRegulatorResponse {
  int32 fr_id = 1;
}

// AddFluidRegulatorRequest requests addition of a new fluid regulator.
message AddFluidRegulatorRequest {
  fhs_types.FluidRegulator fluid = 1;
}

// RemoveFluidRegulatorRequest requests removal of a fluid regulator by ID.
message RemoveFluidRegulatorRequest {
  int32 fr_id = 1;
}

// AddFluidRegulatorResponse returns the ID of the 
// newly created fluid regulator.
message AddFluidRegulatorResponse {
  int32 fr_id = 1;
}

// Operation defines the comparison operations that can be used
// when querying and filtering data.
enum Operation {
  OPERATION_UNSPECIFIED=0;
  OPERATION_EQUAL=1;
  OPERATION_NOT_EQUAL=2;
  OPERATION_IN=3;
  OPERATION_NOT_IN =4;
  OPERATION_GREATER_THAN = 5;
  OPERATION_GREATER_THAN_OR_EQUAL = 6;
  OPERATION_LESS_THAN_OR_EQUAL = 7;
  OPERATION_LESS_THAN = 8;
  OPERATION_LIKE = 9;
  OPERATION_NOT_LIKE = 10;
  OPERATION_IS = 11;
  OPERATION_NOT_IS = 12;
}

// FetchData represents a query expression for filtering data.
// It combines a column name, comparison operation, and values.
message FetchData {
  string column = 1;
  Operation operation = 2;
  string values = 3;
}

// CollectFluidRegulatorsRequest requests a collection of
// fluid regulators matching the specified query expressions.
message CollectFluidRegulatorsRequest {
  repeated FetchData expressions = 1;
}

// CollectFluidRegulatorsResponse returns the fluid regulators
// matching the query.
message CollectFluidRegulatorsResponse {
  repeated fhs_types.FluidRegulator fluids = 1;
}

// AddRecipeRequest requests addition of a new recipe.
message AddRecipeRequest {
  recipe_types.Recipe recipe = 1;
}

// AddRecipeResponse returns the ID of the newly created recipe.
message AddRecipeResponse {
  int32 recipe_id = 1;
}

// GetRecipeRequest requests a recipe by ID.
message GetRecipeRequest {
  int32 recipe_id = 1;
}

// GetRecipeResponse returns the requested recipe.
message GetRecipeResponse {
  recipe_types.Recipe recipe = 1;
}

// ModifyRecipeRequest requests modification of an existing recipe.
message ModifyRecipeRequest {
  recipe_types.Recipe recipe = 1;
}

// ModifyRecipeResponse returns the ID of the modified recipe.
message ModifyRecipeResponse {
  int32 recipe_id = 1;
}

// RemoveRecipeRequest requests removal of a recipe by ID.
message RemoveRecipeRequest {
  int32 recipe_id = 1;
}

// CollectRecipeRequest requests a collection of recipes
// matching the specified query expressions.
message CollectRecipeRequest {
  repeated FetchData expressions = 1;
}

// CollectRecipeResponse returns the recipes matching the query.
message CollectRecipeResponse {
  repeated recipe_types.Recipe recipes = 1;
}

// RecipeInstructionOrder defines the ordering of instructions
// within a recipe.
message RecipeInstructionOrder {
  int32 recipe_id = 1;
  int32 instruction_id = 2;
  int32 position = 3;
  optional int32 id = 4;
}

// AddRecipeInstOrderRequest requests addition of recipe
// instruction orderings.
message AddRecipeInstOrderRequest {
  repeated RecipeInstructionOrder recipe_orders = 1;
}

// AddRecipeInstOrderResponse returns the IDs of the newly
// created orderings.
message AddRecipeInstOrderResponse {
  repeated int32 ids = 1;
}

// CollectRecipeInstOrderRequest requests a collection of
// recipe instruction orderings matching the query expressions.
message CollectRecipeInstOrderRequest {
  repeated FetchData expressions = 1;
}

// CollectRecipeInstOrderResponse returns the recipe instruction
// orderings matching the query.
message CollectRecipeInstOrderResponse {
  repeated RecipeInstructionOrder recipe_to_instructions = 1;
}

// RemoveRecipeInstOrderRequest requests removal of a recipe
// instruction ordering by ID.
message RemoveRecipeInstOrderRequest {
  int32 id = 1;
}

// UpdateRecipeInstOrderRequest requests update of recipe
// instruction orderings for a specific recipe.
message UpdateRecipeInstOrderRequest {
  repeated RecipeInstructionOrder recipe_orders = 1;
  int32 recipe_id = 2;
}

// AddInstructionRequest requests addition of a new instruction.
message AddInstructionRequest {
  recipe_types.Instruction instruction = 1;
}

// AddInstructionResponse returns the ID of the newly created
// instruction.
message AddInstructionResponse {
  int32 instruction_id = 1;
}

// CollectInstructionRequest requests a collection of instructions
// matching the specified query expressions.
message CollectInstructionRequest {
  repeated FetchData expressions = 1;
}

// CollectInstructionResponse returns the instructions matching
// the query.
message CollectInstructionResponse {
  repeated recipe_types.Instruction instructions = 1;
}

// GetInstructionRequest requests an instruction by ID.
message GetInstructionRequest {
  int32 instruction_id = 1;
}

// GetInstructionResponse returns the requested instruction.
message GetInstructionResponse {
  recipe_types.Instruction instruction = 1;
}

// RemoveInstructionRequest requests removal of an instruction
// by ID.
message RemoveInstructionRequest {
  int32 instruction_id = 1;
}

// ModifyInstructionRequest requests modification of an existing
// instruction.
message ModifyInstructionRequest {
  recipe_types.Instruction instruction = 1;
}

// ModifyInstructionResponse returns the ID of the modified
// instruction.
message ModifyInstructionResponse {
  int32 instruction_id = 1;
}

// ModifyIngredientRequest requests modification of an existing
// ingredient with optional updates to related entities.
message ModifyIngredientRequest {
  recipe_types.Ingredient ingredient = 1;
  bool update_fr = 2;
  bool update_instruction = 3;
}

// ModifyIngredientResponse returns the ID of the modified
// ingredient.
message ModifyIngredientResponse {
  int32 ingredient_id = 1;
}

// AddIngredientRequest requests addition of a new ingredient.
message AddIngredientRequest {
  recipe_types.Ingredient ingredient = 1;
}

// AddIngredientResponse returns the ID of the newly created
// ingredient.
message AddIngredientResponse {
  int32 ingredient_id = 1;
}

// CollectIngredientRequest requests a collection of ingredients
// matching the specified query expressions.
message CollectIngredientRequest {
  repeated FetchData expressions = 1;
}

// CollectIngredientResponse returns the ingredients matching
// the query.
message CollectIngredientResponse {
  repeated recipe_types.Ingredient ingredients = 1;
}

// RemoveIngredientRequest requests removal of an ingredient
// by ID.
message RemoveIngredientRequest {
  int32 ingredient_id = 1;
}

// GetIngredientRequest requests an ingredient by ID.
message GetIngredientRequest {
  int32 ingredient_id = 1;
}

// GetIngredientResponse returns the requested ingredient.
message GetIngredientResponse {
  recipe_types.Ingredient ingredient = 1;
}

// ResetType defines the scope of a database reset operation.
enum ResetType {
  RESET_TYPE_UNSPECIFIED = 0;
  RESET_TYPE_ALL = 1;
}

// ResetRequest requests a database reset for the specified
// entity type.
message ResetRequest {
  EntityType entity = 1;
  ResetType reset_type = 2;
}

// ResetResponse confirms completion of the reset operation.
message ResetResponse {

}