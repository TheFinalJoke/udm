[package]
name = "udm"
version = "0.1.0"
edition = "2021"
default-run = "udm"

[[bin]]
name = "daemon"
path = "src/daemon/main.rs"

[[bin]]
name = "udm"
path = "src/bin/main.rs"

[lib]
name = "lib"
path = "src/lib/lib.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "signal"] }
log = "0.4"
env_logger = { version = "0.11" }
rusqlite = { version = "0.30", features = ["bundled"] }
mockall = "0.13"
config = "0.14"
clap = { version = "4.5", features = ["derive"] }
itertools = "0.13"
libsqlite3-sys = { version = "0.27", features = ["bundled"] }
sea-query = { version = "0.30", features = ["with-uuid", "backend-postgres"]}
serde = "1.0"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-reflection = "0.12"
postgres = "0.19"
thiserror = "1.0"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
async-trait = "0.1"
tokio-rusqlite = "0.5"
serde_derive = "1.0"
serde_json = "1.0"
anyhow = "1.0"
regex = "1.10"
cli-table = "0.4"
clap-verbosity-flag = "2.2"
pretty_env_logger = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-futures = "0.2"
tracing-json = "0.1"
futures = "0.3"
num_cpus = "1.17"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
uuid = { version = "1.19", features = ["v4", "fast-rng", "macro-diagnostics"] }
bon = "3.8"
gpiocdev = "0.8.0"

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
tonic-build = "0.12"
